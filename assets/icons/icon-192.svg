<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="url(#primary)" stroke-width="4" opacity="0.3" stroke-dasharray="10 6" />
  
  <!-- Gordolak Body Shape -->
  <circle cx="96" cy="96" r="62" fill="url(#primary)" filter="url(#glow)"/>
  
  <!-- Belly / Core -->
  <circle cx="96" cy="102" r="38" fill="url(#core)"/>
  
  <!-- Eyes -->
  <ellipse cx="80" cy="84" rx="6" ry="8" fill="#0f172a" />
  <circle cx="78" cy="82" r="2.5" fill="#ffffff" />
  
  <ellipse cx="112" cy="84" rx="6" ry="8" fill="#0f172a" />
  <circle cx="110" cy="82" r="2.5" fill="#ffffff" />
  
  <!-- Cheeks -->
  <circle cx="72" cy="95" r="4" fill="#f87171" opacity="0.7"/>
  <circle cx="120" cy="95" r="4" fill="#f87171" opacity="0.7"/>
  
  <!-- Smile -->
  <path d="M 86 98 Q 96 109 106 98" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Athletic Headband -->
  <path d="M 46 72 Q 96 52 146 72" fill="none" stroke="#f43f5e" stroke-width="9" stroke-linecap="round"/>
  <circle cx="96" cy="62" r="6" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
</svg>